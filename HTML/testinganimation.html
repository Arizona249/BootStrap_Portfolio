<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Animation Test</title>
    <style>
        body {
            height: 300vh;
            background: #111;
            color: white;
        }

        @keyframes appear {
            from {
                opacity: 0;
                scale: 0.8;
            }

            to {
                opacity: 1;
                scale: 1;
            }
        }

        .project {
            width: 200px;
            height: 200px;
            background: teal;
            margin: 150vh auto;
            border-radius: 1rem;

            /* view-timeline-name: --projectTimeline; */
            animation-name: appear;
            animation-duration: 1s;
            animation-fill-mode: both;
            animation-timeline: view();
            animation-range: entry 0% cover 50%;
        }
    </style>
</head>

<body>
    <div class="project"></div>
</body>

</html>
